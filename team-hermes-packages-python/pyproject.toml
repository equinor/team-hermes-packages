[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "team-hermes-packages"
version = "0.1.0"
description = "Shared Python code for Team Hermes projects"
readme = "README.md"
license-files = ["LICENSE.md"]
requires-python = ">=3.13"
dependencies = ["pydantic>=2,<3", "elasticsearch>=8.18,<9"]
classifiers = [
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Repository = "https://github.com/equinor/team-hermes-packages"
Issues = "https://github.com/equinor/team-hermes-packages/issues"

[dependency-groups]
dev = [
  "fastapi>=0.141.1,<0.142",
  "pytest>=9.1,<10",
  "pytest-mock>=3.14.1,<4",
  "hypothesis>=6.151.9,<7",
  "pyrefly>=1.2.0,<1.4",
  "ruff>=0.15.16",
]

[tool.hatch.build.targets.wheel]
packages = ["src/team_hermes"]

[tool.hatch.build.targets.sdist]
include = ["src", "pyproject.toml", "README.md", "LICENSE.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--import-mode=importlib"

[tool.ruff]
extend = "../.ruff.toml"
src = [".", "src"]
namespace-packages = ["src/team_hermes"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pyrefly]
project-includes = ["src", "tests"]
search-path = ["src", "."]
python-version = "3.13"
