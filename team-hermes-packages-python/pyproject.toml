[dependency-groups]
dev = ["pytest>=9.1,<10", "pyrefly>=1.2.0,<1.4", "ruff>=0.15.16"]

[tool.uv.workspace]
members = [
  "elasticsearch",
  "core",
  "validation",
  "query",
  "fastapi-error-handling",
  "fastapi-query",
  "sqlalchemy-core",
  "sqlalchemy-faceted-search",
  "sqlalchemy-repository",
]

[tool.pytest.ini_options]
testpaths = ["*/tests"]
addopts = "--import-mode=importlib"

[tool.pyrefly]
project-includes = ["*/src", "*/tests"]
search-path = [
  "core/src",
  "elasticsearch/src",
  "elasticsearch",
  "validation/src",
  "query/src",
  "fastapi-error-handling/src",
  "fastapi-query/src",
  "sqlalchemy-core/src",
  "sqlalchemy-faceted-search/src",
  "sqlalchemy-repository/src",
]
python-version = "3.13"

[tool.ruff]
extend = "../.ruff.toml"
