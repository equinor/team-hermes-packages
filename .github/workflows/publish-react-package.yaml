name: "team-hermes-packages-react: publish"
on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  publish:
    # Only run for releases tagged by release-please for the react package
    if: startsWith(github.event.release.tag_name, 'team-hermes-packages-react-v')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: team-hermes-packages-react
    steps:
      - name: "Setup: checkout repository"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: "Setup: Runtimes"
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        timeout-minutes: 5

      - name: "Setup: Install dependencies"
        run: vp install --frozen-lockfile

      - name: "Build library"
        run: vp run build

      - name: "Create tarball"
        run: npm pack

      - name: "Upload tarball to release"
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" *.tgz --clobber
