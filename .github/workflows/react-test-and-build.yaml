name: "team-hermes-packages-react: test and build"
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: team-hermes-packages-react
    steps:
      - name: "Setup: checkout repository"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: "Setup: Runtimes"
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        timeout-minutes: 5

      - name: "Setup: Vite+"
        uses: voidzero-dev/setup-vp@9fd26ff49f9b5e6276c2b493da4454ad4527f7f4 # v1.20.0
        with:
          version: "0.2.1"
          node-manager: false
          run-install: false

      - name: "Test"
        run: mise run test:unit:team-hermes-packages-react

      - name: "Build verification"
        run: vp pack
