name: "Release Please"
on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      team-hermes-packages-react--release_created: ${{ steps.release.outputs['team-hermes-packages-react--release_created'] }}
      team-hermes-packages-react--tag_name: ${{ steps.release.outputs['team-hermes-packages-react--tag_name'] }}
      team-hermes-packages-react--version: ${{ steps.release.outputs['team-hermes-packages-react--version'] }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-react:
    needs: release-please
    if: needs.release-please.outputs.team-hermes-packages-react--release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    defaults:
      run:
        working-directory: team-hermes-packages-react
    steps:
      - name: "Setup: checkout repository"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: "Setup: Runtimes"
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        timeout-minutes: 5

      - name: "Setup: Install dependencies"
        run: vp install --frozen-lockfile

      - name: "Build library"
        run: vp run build

      - name: "Create tarball"
        run: npm pack

      - name: "Upload tarball to release"
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.release-please.outputs.team-hermes-packages-react--tag_name }}" *.tgz --clobber

      - name: "Publish to npm"
        run: npm publish --access public
