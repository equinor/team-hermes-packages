[project]
name = "hermes-faceted-search-demo"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = ["team-hermes-packages", "fastapi>=0.141.1,<0.142", "uvicorn>=0.34,<1"]

[tool.uv.sources]
team-hermes-packages = { path = "../../../team-hermes-packages-python", editable = true }

[dependency-groups]
dev = ["ruff>=0.15.16", "pyrefly>=1.2.0,<1.4"]

[tool.ruff]
extend = "../../../.ruff.toml"

[tool.pyrefly]
project-includes = ["*.py"]
python-version = "3.14"
