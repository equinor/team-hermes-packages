[tools]
oxfmt = "0.54.0"
node = "24.16.0"
prek = { version = "0.4.4", postinstall = "prek install" }
python = "3.14.6"
uv = "0.13.5"
hadolint = "2.14.0"

[settings]
python.uv_venv_auto = "source"

[vars]
python_workspace_dir = "{{env.PYTHON_WORKSPACE_DIR | default(value='team-hermes-packages-python')}}"

[tasks."format:oxlint"]
run = "oxfmt --no-error-on-unmatched-pattern"

[tasks."team-hermes-packages-react:dependencies"]
dir = "{{config_root}}/team-hermes-packages-react"
run = "vp install --frozen-lockfile"

[tasks."team-hermes-packages-react:check"]
depends = ["team-hermes-packages-react:dependencies"]
dir = "{{config_root}}/team-hermes-packages-react"
run = "vp check --fix"

[tasks."test:unit:team-hermes-packages-react"]
dir = "{{config_root}}/team-hermes-packages-react"
depends = ["team-hermes-packages-react:dependencies"]
run = "vp test"

[tasks."team-hermes-packages-react:pack"]
depends = ["team-hermes-packages-react:dependencies"]
dir = "{{config_root}}/team-hermes-packages-react"
run = "vp pack"

[tasks."team-hermes-packages-react:build-storybook"]
depends = ["team-hermes-packages-react:dependencies"]
dir = "{{config_root}}/team-hermes-packages-react"
run = "vp exec storybook build"

[tasks."python:dependencies"]
alias = "team-hermes-packages-python:dependencies"
dir = "{{config_root}}/{{vars.python_workspace_dir}}"
run = "uv sync --locked --all-packages"

[tasks."python:lint"]
dir = "{{config_root}}/{{vars.python_workspace_dir}}"
depends = ["python:dependencies"]
run = ["uv run --no-sync ruff check .", "uv run --no-sync ruff format --check ."]

[tasks."python:typecheck"]
dir = "{{config_root}}/{{vars.python_workspace_dir}}"
depends = ["python:dependencies"]
run = "uv run --no-sync pyrefly check"

[tasks."python:test"]
dir = "{{config_root}}/{{vars.python_workspace_dir}}"
alias = "test:unit:team-hermes-packages-python"
depends = ["python:dependencies"]
run = "uv run --no-sync pytest -W default::DeprecationWarning"

[tasks."python:test:core"]
dir = "{{config_root}}/{{vars.python_workspace_dir}}"
run = "uv run --no-project --with ./core --with 'pytest>=9.1,<10' pytest -W default::DeprecationWarning core/tests"

[tasks."python:test:query"]
dir = "{{config_root}}/{{vars.python_workspace_dir}}"
run = "uv run --no-project --with ./core --with ./query --with 'pytest>=9.1,<10' pytest -W default::DeprecationWarning query/tests"

[tasks."python:build"]
dir = "{{config_root}}/{{vars.python_workspace_dir}}"
alias = "team-hermes-packages-python:build"
run = "uv build --all-packages --no-sources --out-dir dist"

[tasks."python:test:fastapi-error-handling"]
dir = "{{config_root}}/{{vars.python_workspace_dir}}"
run = [
  "uv build --wheel --package team-hermes-core --no-sources --out-dir dist/fastapi-error-handling",
  "uv build --wheel --package team-hermes-fastapi-error-handling --no-sources --out-dir dist/fastapi-error-handling",
  "uv run --no-project --with ./dist/fastapi-error-handling/team_hermes_core-*.whl --with ./dist/fastapi-error-handling/team_hermes_fastapi_error_handling-*.whl --with 'pytest>=9.1,<10' --with 'httpx>=0.28' --with 'requests>=2.32' --with 'opentelemetry-sdk>=1.30' --with '{{env.FASTAPI_REQUIREMENT | default(value='fastapi')}}' pytest -W default::DeprecationWarning fastapi-error-handling/tests",
]

[tasks."python:test:fastapi-query"]
dir = "{{config_root}}/{{vars.python_workspace_dir}}"
run = [
  "uv build --wheel --package team-hermes-core --no-sources --out-dir dist/fastapi-query",
  "uv build --wheel --package team-hermes-query --no-sources --out-dir dist/fastapi-query",
  "uv build --wheel --package team-hermes-fastapi-query --no-sources --out-dir dist/fastapi-query",
  "uv run --no-project --isolated --with ./dist/fastapi-query/team_hermes_core-*.whl --with ./dist/fastapi-query/team_hermes_query-*.whl --with ./dist/fastapi-query/team_hermes_fastapi_query-*.whl --with 'pytest>=9.1,<10' --with 'httpx>=0.28,<1' --with '{{env.FASTAPI_REQUIREMENT | default(value='fastapi')}}' --with '{{env.PYDANTIC_REQUIREMENT | default(value='pydantic')}}' pytest -W default::DeprecationWarning fastapi-query/tests",
]
