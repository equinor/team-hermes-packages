[tools]
oxfmt = "0.54.0"
node = "24.16.0"
prek = { version = "0.4.4", postinstall = "prek install" }
python = "3.14.6"
uv = "0.11.21"
hadolint = "2.14.0"

[settings]
python.uv_venv_auto = "source"

[tasks."format:oxlint"]
run = "oxfmt --no-error-on-unmatched-pattern"

[tasks."team-hermes-packages-react:dependencies"]
dir = "{{config_root}}/team-hermes-packages-react"
run = "vp install --frozen-lockfile"

[tasks."team-hermes-packages-react:check"]
depends = ["team-hermes-packages-react:dependencies"]
dir = "{{config_root}}/team-hermes-packages-react"
run = "vp check --fix"

[tasks."test:unit:team-hermes-packages-react"]
dir = "{{config_root}}/team-hermes-packages-react"
depends = ["team-hermes-packages-react:dependencies"]
run = "vp test"

[tasks."team-hermes-packages-react:pack"]
depends = ["team-hermes-packages-react:dependencies"]
dir = "{{config_root}}/team-hermes-packages-react"
run = "vp pack"

[tasks."team-hermes-packages-react:build-storybook"]
depends = ["team-hermes-packages-react:dependencies"]
dir = "{{config_root}}/team-hermes-packages-react"
run = "vp exec storybook build"

[tasks."team-hermes-packages-python:dependencies"]
dir = "{{config_root}}/team-hermes-packages-python"
run = "uv sync --locked"

[tasks."team-hermes-packages-python:check"]
depends = ["team-hermes-packages-python:typecheck"]
dir = "{{config_root}}/team-hermes-packages-python"
run = ["uv run --locked ruff check .", "uv run --locked ruff format --check ."]

[tasks."team-hermes-packages-python:typecheck"]
depends = ["team-hermes-packages-python:dependencies"]
dir = "{{config_root}}/team-hermes-packages-python"
run = "uv run --locked pyrefly check"

[tasks."test:unit:team-hermes-packages-python"]
depends = ["team-hermes-packages-python:dependencies"]
dir = "{{config_root}}/team-hermes-packages-python"
run = "uv run --locked pytest"

[tasks."team-hermes-packages-python:pack"]
dir = "{{config_root}}/team-hermes-packages-python"
run = "uv build --no-sources"
