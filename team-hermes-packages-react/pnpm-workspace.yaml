packages:
  - packages/*

catalog:
  '@tailwindcss/vite': ^4.3.1
  '@testing-library/react': ^16.3.2
  '@types/node': ^25.6.2
  '@types/react': ^19.2.17
  '@types/react-dom': ^19.2.3
  jsdom: ^29.1.1
  tailwindcss: ^4.3.1
  typescript: ^6.0.3
  vite-plus: 1.7.0
  vite: npm:@voidzero-dev/vite-plus-core@8.3.8000
  vitest: 5.1.0
  '@vitest/browser-playwright': 5.1.0

overrides:
  vite@*: 'catalog:'
  vitest@*: 'catalog:'

allowBuilds:
  '@parcel/watcher': true
  '@vaadin/vaadin-usage-statistics': false
  esbuild: true
peerDependencyRules:
  allowAny:
    - vitest
  allowedVersions:
    vitest: '*'
minimumReleaseAgeExclude:
  - '@testing-library/jest-dom@8.0.0'
